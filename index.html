<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المنصة الالكترونية</title>

    <!-- إعدادات تطبيق الويب PWA وتجاوب الهواتف -->
    <meta name="theme-color" content="#0B2533" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="المنصة الالكترونية" />

    <!-- خط Tajawal العربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- مكتبة Tailwind CSS للتجاوب السريع -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- مكتبة FontAwesome للأيقونات -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- التنسيقات المخصصة والطباعة -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-800 font-['Tajawal'] min-h-screen flex flex-col antialiased"
  >
    <!-- ================= 1. الهيدر الرئيسي الرسمي ================= -->
    <header
      class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30"
    >
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 sm:h-20 items-center">
          <!-- زر القائمة للجوال + الشعارين والعنوان المعتمد -->
          <div
            class="flex items-center space-x-2.5 sm:space-x-3 space-x-reverse"
          >
            <!-- زر 3 شرطات للجوال (يظهر بعد تسجيل الدخول فقط) -->
            <button
              id="mobile-menu-btn"
              onclick="toggleMobileSidebar()"
              class="hidden p-1.5 sm:p-2 text-[#0B2533] hover:bg-slate-100 rounded-xl focus:outline-none"
              title="القائمة الرئيسية"
            >
              <i class="fa-solid fa-bars text-lg sm:text-xl"></i>
            </button>

            <div
              class="flex items-center space-x-2 space-x-reverse cursor-pointer"
              onclick="navigateTo('portal')"
            >
              <!-- شعار مركز مشكاة التعليمي -->
              <img
                src="logo15.png"
                alt="مركز مشكاة"
                class="h-9 sm:h-12 w-auto object-contain"
                onerror="this.style.display = 'none'"
              />

              <!-- فاصل رأسي -->
              <div class="h-7 sm:h-8 w-px bg-slate-200 mx-0.5"></div>

              <!-- شعار مؤسسة توطين العلم -->
              <img
                src="logo16.png"
                alt="توطين العلم"
                class="h-10 sm:h-13 w-auto object-contain"
                onerror="this.style.display = 'none'"
              />

              <div class="mr-1.5 sm:mr-2">
                <h1
                  class="text-sm sm:text-lg font-black text-[#0B2533] leading-tight"
                >
                  المنصة الالكترونية
                </h1>
              </div>
            </div>
          </div>

          <!-- مسار التنبيهات والبروفايل المطور -->
          <div
            id="header-user-controls"
            class="flex items-center space-x-2.5 sm:space-x-4 space-x-reverse"
          >
            <!-- مركز التنبيهات (متاح لجميع المستخدمين بعد تسجيل الدخول) -->
            <div id="notif-container" class="relative hidden">
              <button
                id="notif-btn"
                onclick="toggleNotificationsModal()"
                class="relative p-2 text-slate-600 hover:text-[#0B2533] hover:bg-slate-100 rounded-2xl transition"
                title="التنبيهات والإشعارات"
              >
                <i class="fa-regular fa-bell text-lg sm:text-xl"></i>
                <span
                  id="notif-badge"
                  class="absolute top-1 right-1 bg-[#9E1B48] text-white text-[9px] font-black px-1.5 py-0.2 rounded-full border-2 border-white"
                  >0</span
                >
              </button>
            </div>

            <!-- بطاقة المستخدم التنفيذية الفاخرة (Executive Profile Badge) -->
            <div
              id="header-user-badge"
              class="hidden items-center bg-slate-50/90 hover:bg-slate-100/90 border border-slate-200/90 rounded-2xl py-1 px-1.5 sm:px-2.5 transition-all shadow-xs"
            >
              <!-- الأفاتار الملكي المؤطر -->
              <div
                class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-[#0B2533] text-[#D4A359] font-black flex items-center justify-center border border-[#D4A359]/40 shadow-xs text-xs sm:text-sm shrink-0"
                id="header-avatar"
              >
                إد
              </div>

              <!-- نصوص وبيانات المستخدم -->
              <div class="hidden sm:block mr-2.5 text-right">
                <div
                  class="text-xs font-black text-[#0B2533] leading-snug"
                  id="header-user-name"
                >
                  إدارة المنصة المركزية
                </div>
                <div
                  class="text-[10px] text-slate-500 font-bold"
                  id="header-user-role"
                >
                  إدارة كاملة لكل البرامج
                </div>
              </div>

              <!-- فاصل رأسي هادئ -->
              <div class="hidden sm:block h-5 w-px bg-slate-200 mx-2"></div>

              <!-- زر تسجيل الخروج -->
              <button
                onclick="logoutUser()"
                class="p-1.5 text-slate-400 hover:text-rose-600 rounded-xl transition"
                title="تسجيل الخروج"
              >
                <i
                  class="fa-solid fa-arrow-right-from-bracket text-xs sm:text-sm"
                ></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- خلفية تعتيم للشاشات الصغيرة عند فتح القائمة الجانبية -->
    <div
      id="sidebar-backdrop"
      onclick="toggleMobileSidebar()"
      class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 md:hidden transition-opacity"
    ></div>

    <!-- ================= 2. الحاوية الرئيسية للتطبيق ================= -->
    <div
      class="flex-1 max-w-7xl w-full mx-auto px-2.5 sm:px-6 lg:px-8 py-3 sm:py-6 flex flex-col md:flex-row gap-4 sm:gap-6"
    >
      <!-- القائمة الجانبية (تظهر بعد تسجيل الدخول مباشرة) -->
      <aside
        id="main-sidebar"
        class="hidden md:hidden fixed md:static top-0 right-0 h-full md:h-fit w-64 bg-white md:rounded-3xl border-l md:border border-slate-200 shadow-2xl md:shadow-sm p-3.5 shrink-0 z-50 md:z-auto transform translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto"
      >
        <div
          class="flex justify-between items-center mb-3 md:hidden pb-2.5 border-b border-slate-100"
        >
          <span class="font-black text-[#0B2533] text-xs sm:text-sm"
            >القائمة الرئيسية</span
          >
          <button
            onclick="toggleMobileSidebar()"
            class="p-1 text-slate-400 hover:text-slate-700"
          >
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </div>
        <nav id="sidebar-nav" class="space-y-1">
          <!-- يتم توليد القوائم ديناميكياً بعد تسجيل الدخول -->
        </nav>
      </aside>

      <!-- منطقة المحتوى المتغير -->
      <main id="app-content" class="flex-1 min-w-0">
        <div class="flex justify-center items-center h-64 text-slate-400">
          <i
            class="fa-solid fa-circle-notch fa-spin text-2xl sm:text-3xl text-[#169BA2]"
          ></i>
          <span class="mr-2.5 font-semibold text-xs sm:text-sm"
            >جاري تحميل المنصة...</span
          >
        </div>
      </main>
    </div>

    <!-- ================= 3. المودال العام للإشعارات ================= -->
    <div
      id="notifications-modal"
      class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-start pt-16 sm:pt-20 px-3 sm:px-4"
    >
      <div
        class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-lg w-full overflow-hidden animate-in fade-in duration-150 border-t-4 border-t-[#D4A359]"
      >
        <div
          class="bg-[#0B2533] text-white px-5 py-3.5 sm:py-4 flex justify-between items-center border-b border-[#D4A359]"
        >
          <h3 class="font-bold text-xs sm:text-base flex items-center">
            <i class="fa-solid fa-bell text-[#D4A359] ml-2"></i> مركز الإشعارات
            والتنبيهات
          </h3>
          <button
            onclick="toggleNotificationsModal()"
            class="text-slate-300 hover:text-white"
          >
            <i class="fa-solid fa-xmark text-base sm:text-lg"></i>
          </button>
        </div>
        <div
          id="notifications-list"
          class="p-3.5 sm:p-4 max-h-[60vh] overflow-y-auto divide-y divide-slate-100 text-xs"
        ></div>
        <div
          class="bg-slate-50 px-5 py-2.5 border-t border-slate-100 text-center"
        >
          <button
            onclick="markAllNotificationsRead()"
            class="text-[11px] sm:text-xs text-[#169BA2] font-bold hover:underline"
          >
            تحديد الكل كمقروء
          </button>
        </div>
      </div>
    </div>

    <!-- ================= 4. الفوتر ================= -->
    <footer
      class="bg-white border-t border-slate-200 mt-auto py-3.5 sm:py-5 text-xs text-slate-500"
    >
      <div
        class="max-w-7xl mx-auto px-4 flex items-center justify-center sm:justify-start"
      >
        <div class="flex items-center space-x-3 space-x-reverse">
          <img
            src="logo15.png"
            alt="مركز مشكاة"
            class="h-6 sm:h-7 w-auto object-contain opacity-85"
            onerror="this.style.display = 'none'"
          />
          <div class="h-4 sm:h-5 w-px bg-slate-200"></div>
          <img
            src="logo16.png"
            alt="توطين العلم"
            class="h-7 sm:h-8 w-auto object-contain opacity-85"
            onerror="this.style.display = 'none'"
          />
        </div>
      </div>
    </footer>

    <!-- مكتبات Firebase SDK المعتمدة (Compat CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- ربط الملفات البرمجية بالترتيب الصحيح -->
    <script src="data.js"></script>
    <script src="views.js"></script>
    <script src="app.js"></script>
  </body>
</html>
